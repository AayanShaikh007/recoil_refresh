name: Android compatibility build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/android" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/android" --no-metrics --sdk="$ANDROID_HOME" sdk install 'platforms;android-37.0'
            "$ANDROID_HOME/cmdline-tools/latest/bin/android" --no-metrics --sdk="$ANDROID_HOME" sdk install 'build-tools;37.0.0'
          else
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          fi
      - name: Test, lint and build
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: recoil-refresh-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
